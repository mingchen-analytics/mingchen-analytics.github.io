const D=window.COMPANY_DATA||[],S='ming-career-fair-guide-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(S)||'{}')}catch(e){};const esc=s=>(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const cards=document.getElementById('cards');function render(){cards.innerHTML=D.map((x,i)=>{const num=x.rank?`#${esc(x.rank)}`:(x.roster||`Roster #${i+1}`);const boxes=(x.boxes||[]).map(b=>`<div class="box"><h4>${esc(b.h)}</h4><ul>${(b.items||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`).join('');const qs=(x.q||[]).map(q=>`<div class="q"><div class="qt">${esc(q)}</div><button class="copy">Copy</button></div>`).join('');return `<section class="card" id="${esc(x.id)}" data-p="${esc(x.p)}" data-d="${x.d?'1':'0'}"><div class="head"><div class="num">${num}</div><div class="company">${esc(x.company)}</div><div class="role">${esc(x.role)}</div><div class="badges">${(x.badges||[]).map(b=>`<span class="badge">${esc(b)}</span>`).join('')}</div>${x.quick?`<div class="quick"><b>快速判斷：</b>${esc(x.quick.replace(/^快速判斷：/,'').trim())}</div>`:''}${(x.meta||[]).map(m=>`<div class="meta">${esc(m)}</div>`).join('')}</div>${(boxes||qs)?`<details><summary>補充資訊 / 問題</summary><div class="body">${boxes}${qs}</div></details>`:''}<label class="visit"><input type="checkbox" data-v="${esc(x.id)}">已拜訪</label><textarea class="note" data-n="${esc(x.id)}" placeholder="Recruiter 名字、職位、visa、follow-up…"></textarea></section>`}).join('');bind();apply()}function bind(){document.querySelectorAll('[data-v]').forEach(e=>{e.checked=!!saved['v_'+e.dataset.v];e.onchange=()=>{saved['v_'+e.dataset.v]=e.checked;localStorage.setItem(S,JSON.stringify(saved));apply()}});document.querySelectorAll('[data-n]').forEach(e=>{e.value=saved['n_'+e.dataset.n]||'';e.oninput=()=>{saved['n_'+e.dataset.n]=e.value;localStorage.setItem(S,JSON.stringify(saved))}});document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const t=b.parentElement.querySelector('.qt').innerText;try{await navigator.clipboard.writeText(t);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy',1000)}catch(e){}})}let f='all',q='',only=false;function apply(){let n=0;document.querySelectorAll('.card').forEach(c=>{const txt=(c.textContent||'').toLowerCase();const search=!q||txt.includes(q);let ok=true;if(!q){if(f==='detail')ok=c.dataset.d==='1';else if(f==='core')ok=c.dataset.p==='core';else if(f==='worth')ok=['core','worth'].includes(c.dataset.p);else if(f==='skip')ok=c.dataset.p==='skip'}const cb=c.querySelector('[data-v]');const vis=q?true:(!only||!cb?.checked);const show=search&&ok&&vis;c.classList.toggle('hidden',!show);if(show)n++});document.getElementById('status').textContent=q?`找到 ${n} 家符合「${document.getElementById('search').value.trim()}」`:''}document.getElementById('search').oninput=e=>{q=e.target.value.trim().toLowerCase();apply()};document.getElementById('go').onclick=()=>{q=document.getElementById('search').value.trim().toLowerCase();apply();document.querySelector('.card:not(.hidden)')?.scrollIntoView({behavior:'smooth',block:'start'})};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=b.dataset.f;q='';document.getElementById('search').value='';document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active',x===b));apply()});document.getElementById('unvisited').onclick=()=>{only=!only;q='';document.getElementById('search').value='';apply()};let ex=false;document.getElementById('expand').onclick=()=>{ex=!ex;document.querySelectorAll('details').forEach(d=>{if(!d.closest('.hidden'))d.open=ex})};render();if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
